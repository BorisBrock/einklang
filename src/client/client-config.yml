# Your name in all chat rooms. If empty, it defaults to your OS login name.
user-name: ""

last-used-server-address: "localhost"
last-used-room-name: "Test Room"
last-used-server-port: 24816
window-width: 900
window-height: 600

# Voice chat settings
voice-enabled: true  # set to false to fully disable client voice chat
input-gain: 1.0      # microphone gain (0.0 – 2.0)
output-volume: 1.0   # playback volume (0.0 – 1.0)

# Audio devices by name, as shown in Settings > Audio. Empty = system default.
input-device: ""
output-device: ""

# VAD (Voice Activity Detection) — adaptive gate that opens when speech is detected.
#
# vad-min-rms-floor: hard minimum energy required before the gate can ever open.
#   0.003 = very sensitive, 0.005 = good default, 0.02 = aggressive gating.
vad-min-rms-floor: 0.005

# vad-snr-factor: dynamic threshold multiplier applied on top of the estimated
#   noise floor.  Higher = more aggressive gating; lower = more sensitive.
vad-snr-factor: 4.0

# vad-attack-frames: number of consecutive positive frames required to open
#   the gate.  Higher values reduce false positives but add slight open latency.
vad-attack-frames: 2

# vad-release-frames: number of frames the gate stays open after the last
#   positive frame.  Higher values prevent clipping the tail of words.
vad-release-frames: 20

# vad-zcr-min / vad-zcr-max: speech-like zero-crossing rate band (crossings/sec).
#   Frames whose ZCR falls outside this window are treated as non-speech.
vad-zcr-min: 500.0
vad-zcr-max: 5000.0

# Noise filter: applies a first-order high-pass IIR filter (~80 Hz cutoff)
# to each captured frame before the VAD check and encoding.  Removes DC
# offset, fan hum, desk vibration, and other low-frequency rumble.
noise-filter: true

