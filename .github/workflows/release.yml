name: Release

# Publishes a release when a version tag (e.g. v1.0.0) is pushed. The tag must
# point at a commit on main; its version is compiled into every artifact.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag format and that it is on main
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not of the form vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux AppImage
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build pkg-config file dpkg-dev \
            libglib2.0-bin libgdk-pixbuf2.0-bin librsvg2-common \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libwebkitgtk-6.0-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DEINKLANG_BUILD_CLIENT=ON \
            -DEINKLANG_BUILD_TESTS=ON \
            -DEINKLANG_VERSION=${{ needs.verify.outputs.version }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package AppImage
        run: packaging/linux/build-appimage.sh build "${{ needs.verify.outputs.version }}" release

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage
          if-no-files-found: error
          # Only handed to the github-release job, which attaches the files
          # to the release; don't keep a copy in Actions storage.
          retention-days: 1

  windows:
    name: Windows zip
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -DEINKLANG_BUILD_CLIENT=ON -DEINKLANG_BUILD_TESTS=ON
          -DEINKLANG_VERSION=${{ needs.verify.outputs.version }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package zips
        shell: pwsh
        run: |
          $version = '${{ needs.verify.outputs.version }}'

          # Ship the MSVC runtime app-locally so the zips run without the
          # Visual C++ Redistributable installed.
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crtDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crtDir) { throw "MSVC runtime redist directory not found" }
          $crt = Get-ChildItem $crtDir.FullName -Filter *.dll | ForEach-Object FullName

          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -DestinationPath "release/EinklangClient_Portable_Windows_$version.zip" -Path (
            @('build/Release/EinklangClientApp.exe', 'LICENSE') + $crt)
          Compress-Archive -DestinationPath "release/EinklangServer_Portable_Windows_$version.zip" -Path (
            @('build/Release/EinklangServerApp.exe', 'src/server/server-config.yml', 'LICENSE') + $crt)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.zip
          if-no-files-found: error
          # Only handed to the github-release job, which attaches the files
          # to the release; don't keep a copy in Actions storage.
          retention-days: 1

  docker:
    name: Docker Hub image
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: borisbrock/einklang
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          # latest only for plain vX.Y.Z tags, not pre-releases like v1.0.0-rc1
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          build-args: EINKLANG_VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs: [verify, linux, windows, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the packages: other artifacts in the run (e.g. Docker build
      # records) are not plain zips and fail to download.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,windows}"
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/* "${prerelease[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Einklang $VERSION" \
            --generate-notes \
            --verify-tag
