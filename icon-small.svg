<?xml version="1.0" encoding="UTF-8"?>
<!-- Einklang app icon, simplified for <= 32 px: full-bleed circle, bigger
     bubble, three thick bars, no shine. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="216" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="127" fill="url(#bg)"/>

  <!-- Speech bubble -->
  <path fill="#ffffff" d="M 80 52 H 176 A 32 32 0 0 1 208 84 V 144 A 32 32 0 0 1 176 176 H 120 L 72 216 L 80 176 A 32 32 0 0 1 48 144 V 84 A 32 32 0 0 1 80 52 Z"/>

  <!-- Voice level bars -->
  <g fill="#8b5cf6">
    <rect x="76"  y="96" width="24" height="36"  rx="12"/>
    <rect x="116" y="76" width="24" height="76"  rx="12"/>
    <rect x="156" y="96" width="24" height="36"  rx="12"/>
  </g>
</svg>
