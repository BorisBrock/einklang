services:
  einklang-server:
    # Built from the Dockerfile in this directory: `docker compose up -d --build`
    build: .
    image: einklang-server:latest
    container_name: einklang-server

    # Host networking: the server binds its UDP port directly on the host.
    # This avoids Docker's NAT/userland proxy for voice traffic, keeps real
    # client addresses visible to the server, and works for IPv6 without any
    # extra Docker configuration. Requires a Linux Docker host.
    #
    # Only one port needs to be forwarded in your router: the UDP `port` from
    # server-config.yml (default 24816).
    network_mode: host

    # Alternative for hosts where host networking is unavailable
    # (Docker Desktop): remove `network_mode` above and publish the port.
    # ports:
    #   - "24816:24816/udp"   # must match `port` in server-config.yml

    volumes:
      # Mount a local directory to /data so that both server-config.yml and
      # einklang.db are visible on the host.  On first start the entrypoint
      # script seeds a default server-config.yml if none exists yet.
      - /volume1/docker/einklang/data:/data

    # Restart automatically unless deliberately stopped
    restart: unless-stopped

    # Forward SIGTERM to the process so it can shut down cleanly
    stop_signal: SIGTERM
    stop_grace_period: 10s

    # Health is checked by the image's HEALTHCHECK, which sends a real status
    # query to the server (`EinklangServerApp --healthcheck`).

# No named volumes needed — everything lives in the bind-mounted /volume1/docker/einklang/data folder.
